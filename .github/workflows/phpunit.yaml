name: PHPUnit

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite unit --coverage-clover build/logs/clover.xml
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}

  integration:
    name: Integration (PHP ${{ matrix.php-version }}, Elasticsearch ${{ matrix.elasticsearch-major }})
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: .github/elastic${{ matrix.elasticsearch-major }}/compose.yaml
      ELASTICSEARCH_HOST: localhost:9200

    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        elasticsearch-major: ['8', '9']
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-integration-${{ matrix.php-version }}-${{ matrix.elasticsearch-major }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-integration-${{ matrix.php-version }}-${{ matrix.elasticsearch-major }}-
      - run: composer install --no-interaction --no-progress
      - name: Install Elasticsearch ^${{ matrix.elasticsearch-major }}.0 client
        run: composer require --dev 'elasticsearch/elasticsearch:^${{ matrix.elasticsearch-major }}.0' --with-all-dependencies --no-interaction --no-progress
      - name: Start Elasticsearch
        run: docker compose up --detach --wait --wait-timeout 180
      - run: ./scripts/import_dataset.php
      - run: vendor/bin/phpunit --testsuite integration
      - name: Elasticsearch logs
        if: failure()
        run: docker compose logs
      - name: Stop Elasticsearch
        if: always()
        run: docker compose down --volumes
