version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
    reviewers:
      - "matusboa"
    assignees:
      - "matusboa"
    commit-message:
      prefix: "deps(github): "
  - package-ecosystem: "composer"
    directory: "./"
    schedule:
      interval: "weekly"
    reviewers:
      - "matusboa"
    assignees:
      - "matusboa"
    commit-message:
      prefix: "deps(composer): "
  - package-ecosystem: "docker-compose"
    directories:
      - "/.github/elastic8"
      - "/.github/elastic9"
    schedule:
      interval: "weekly"
    assignees:
      - "matusboa"
    ignore:
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(ci-compose): "
